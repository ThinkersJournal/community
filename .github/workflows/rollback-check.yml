name: rollback-check

# Board 305: proves the production-rollback token works WITHOUT deploying or rolling
# anything back. Manual only, and only from `main` (the Environment is restricted to
# `main` as well). Makes GET requests only: scripts/rollback-check.sh. Run it once
# after the rollback PR lands; the automatic rollback stays off until it passes
# (the AUTO_ROLLBACK_ENABLED repository variable, see prod-smoke.yml).
on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  check:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    environment: production-rollback
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify the token and read the Workers (read-only)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bash scripts/rollback-check.sh
